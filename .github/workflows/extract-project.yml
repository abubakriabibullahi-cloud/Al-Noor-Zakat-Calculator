name: Extract Android Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up ZIP extraction tools
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/alnoor

          zip_file="./AlNoorZakatCalculator_ProjectFiles (1).zip"

          if [ ! -f "$zip_file" ]; then
            echo "ERROR: Project ZIP file not found."
            echo "Expected: $zip_file"
            exit 1
          fi

          unzip -q "$zip_file" -d /tmp/alnoor

          project_file="$(find /tmp/alnoor -type f \( \
            -name settings.gradle.kts -o \
            -name settings.gradle \
          \) -print -quit)"

          if [ -z "$project_file" ]; then
            echo "ERROR: No Gradle settings file found in the ZIP."
            echo "ZIP contents:"
            find /tmp/alnoor -maxdepth 4 -type f | head -100
            exit 1
          fi

          project_dir="$(dirname "$project_file")"

          echo "Android project found at: $project_dir"
          echo "Project files:"
          ls -la "$project_dir"

          if [ -d "$project_dir/.git" ]; then
            rm -rf "$project_dir/.git"
          fi

          cp -a "$project_dir"/. .

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "ERROR: Gradle settings file is missing from repository root."
            exit 1
          fi

          if [ ! -f gradlew ]; then
            echo "ERROR: Gradle wrapper gradlew is missing."
            echo "The project may need its Gradle wrapper added before building."
            exit 1
          fi

          if [ ! -d app ]; then
            echo "ERROR: Android app module directory is missing."
            exit 1
          fi

          echo "Android project structure verified."

      - name: Commit extracted project files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No new project changes to commit."
          else
            git commit -m "Extract Al-Noor Android project files"
            git push
          fi
