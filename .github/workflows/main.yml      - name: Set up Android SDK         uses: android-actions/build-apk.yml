name: Build Al-Noor Zakat Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract project ZIP
        run: |
          set -e

          ZIP_FILE="AlNoorZakatCalculator_Professional_Fixed.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found: $ZIP_FILE"
            echo "Repository files:"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -o -q "$ZIP_FILE" -d extracted

          SETTINGS=$(find extracted \
            -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find extracted \
              -name settings.gradle -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No Gradle settings file found in ZIP."
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          set -e

          APK_PATH=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p release
          cp "$APK_PATH" release/AlNoor-Zakat-Calculator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Noor-Zakat-Calculator-APK
          path: release/AlNoor-Zakat-Calculator.apk
          if-no-files-found: error
          retention-days: 30
