name: Build Al-Noor Professional Zakat Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        run: |
          set -e
          mkdir -p extracted
          unzip -q -o "AlNoorZakatCalculator_Professional (4).zip" -d extracted
          echo "ZIP extracted successfully"
          find extracted -maxdepth 5 -type f | head -100

      - name: Locate Gradle Wrapper
        run: |
          set -e
          WRAPPER=$(find "$GITHUB_WORKSPACE/extracted" -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No gradlew file found inside the ZIP."
            echo "Checking for Gradle build files..."
            find extracted -type f \( -name build.gradle -o -name build.gradle.kts -o -name settings.gradle -o -name settings.gradle.kts \)
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$WRAPPER"

      - name: Build Debug APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Noor-Professional-Zakat-Calculator-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
