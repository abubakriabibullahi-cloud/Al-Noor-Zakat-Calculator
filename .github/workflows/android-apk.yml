name: Build Al-Noor Professional Zakat Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android Project
        run: |
          set -e
          echo "Checking project structure..."
          ls -la

          if [ -f gradlew ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f app/gradlew ]; then
            echo "PROJECT_DIR=app" >> "$GITHUB_ENV"
          else
            echo "ERROR: Gradle wrapper not found."
            find . -maxdepth 5 -type f | head -100
            exit 1
          fi

      - name: Build Debug APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Noor-Professional-Zakat-Calculator-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 30
