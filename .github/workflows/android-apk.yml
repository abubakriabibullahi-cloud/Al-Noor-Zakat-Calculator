name: Build Al-Noor Professional Zakat Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build and Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Locate Android Project
        run: |
          echo "Checking repository structure..."
          ls -la
          find . -maxdepth 4 \
            \( -name gradlew -o -name build.gradle \
            -o -name build.gradle.kts -o -name settings.gradle \
            -o -name settings.gradle.kts \) -print

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          elif [ -f ./app/gradlew ]; then
            chmod +x ./app/gradlew
          else
            echo "ERROR: Gradle wrapper not found."
            exit 1
          fi

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            cd app
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Noor-Professional-Zakat-Calculator
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
