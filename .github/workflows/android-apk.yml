name: Build Al-Noor Professional Zakat Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android Project
        run: |
          set -e
          mkdir -p extracted
          unzip -q -o "AlNoorZakatCalculator_Professional (4).zip" -d extracted
          ls -la extracted/AlNoorZakatCalculator_Professional

      - name: Build Debug APK
        run: |
          set -e
          cd extracted/AlNoorZakatCalculator_Professional
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Noor-Professional-Zakat-Calculator-APK
          path: extracted/AlNoorZakatCalculator_Professional/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
