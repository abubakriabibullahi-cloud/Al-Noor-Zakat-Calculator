name: Build Al-Noor Zakat Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses || true

      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "Checking project structure..."
          ls -la

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew is missing from the repository root."
            exit 1
          fi

          if [ ! -d app ]; then
            echo "ERROR: app directory is missing."
            exit 1
          fi

          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Noor-Zakat-Calculator-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
