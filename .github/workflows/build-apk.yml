name: Build Al-Noor Zakat Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check Android project
        run: |
          echo "Checking Android project files..."
          ls -la

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew is missing from the repository root."
            exit 1
          fi

          if [ ! -d app ]; then
            echo "ERROR: The app folder is missing."
            exit 1
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Noor-Zakat-Calculator-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
