name: Build Al-Noor Zakat Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android project
        run: |
          set -e

          echo "Checking project files..."

          ls -la

          if [ ! -f settings.gradle.kts ] && \
             [ ! -f settings.gradle ]; then
            echo "ERROR: Gradle settings file is missing from repository root."
            exit 1
          fi

          if [ ! -f app/build.gradle.kts ] && \
             [ ! -f app/build.gradle ]; then
            echo "ERROR: Android app module is missing."
            echo "Checking available files:"
            find . -maxdepth 4 -type f -print
            exit 1
          fi

          echo "Android project files found."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          set -e
          gradle assembleDebug --stacktrace

      - name: Find and prepare APK
        run: |
          set -e

          APK="$(find app/build/outputs/apk \
            -type f -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/AlNoor-Zakat-Calculator.apk

          echo "APK generated successfully:"
          ls -lh release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Noor-Zakat-Calculator-APK
          path: release/AlNoor-Zakat-Calculator.apk
          if-no-files-found: error
          retention-days: 30
